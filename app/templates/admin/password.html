{% extends "admin/base.html" %}{% block content %}
<form method="post" class="box narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<h2>Trocar senha</h2>{% if current_user.must_change %}<p>Defina sua senha pessoal para continuar.</p>{% endif %}
<input name="current" type="password" placeholder="Senha atual" required>
<input name="new" type="password" placeholder="Nova senha (mín. 10 caracteres)" required>
<input name="confirm" type="password" placeholder="Confirmar nova senha" required><button class="btn">Salvar</button></form>{% endblock %}
