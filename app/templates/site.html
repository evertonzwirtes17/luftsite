<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="{{ S.seo_desc }}"><meta property="og:title" content="{{ S.store_name }}"><meta property="og:description" content="{{ S.seo_desc }}"><meta name="theme-color" content="#070707">
<title>{% block title %}{{ S.store_name }} · Bom Y Novo{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ asset('css/site.css') }}">
<style>:root{--brand:{{ S.brand_color }}}</style>
</head><body data-wa="{{ S.whatsapp }}" class="{{ 'has-ann' if S.announce }}">
{% if S.announce %}<div class="ann">{% if S.announce_link.startswith(('http', '/')) %}<a href="{{ S.announce_link }}">{{ S.announce }}</a>{% else %}{{ S.announce }}{% endif %}</div>{% endif %}
<a class="skip" href="#conteudo">Ir para o conteúdo</a>
<header class="nav"><a href="{{ url_for('public.index') }}" class="brand" aria-label="BYN Sports"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="" width="34" height="38">BYN<span>BOM Y NOVO</span></a>
  <nav><a href="{{ url_for('public.index') }}#catalogo">Catálogo</a><a href="{{ url_for('public.index') }}#marcas" class="hide-m">Marcas</a>
  <button id="selbtn" class="selbtn">Minha seleção <span id="selcount">0</span></button>
  <a href="https://wa.me/{{ S.whatsapp }}" target="_blank" rel="noopener" class="ghost">WhatsApp</a></nav></header><main id="conteudo" tabindex="-1">{% block body %}{% endblock %}</main>
{% include "_footer.html" %}
<a class="wa-float" href="https://wa.me/{{ S.whatsapp }}" target="_blank" rel="noopener" aria-label="Fale conosco no WhatsApp"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200Zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.8-.8 1-.3.200-.6.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.4l-.8-1.900c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.800 11.800 0 0 0 4.600 4c1.700.7 2.400.8 3.200.700a2.700 2.700 0 0 0 1.800-1.300c.2-.5.2-.9.200-1.100s-.2-.2-.5-.4Z"/></svg><span>Fale conosco</span></a>
<div id="dback" class="dback"></div>
<aside id="drawer" class="drawer" role="dialog" aria-label="Minha seleção" data-intro="{{ S.msg_selection }}" data-outro="{{ S.msg_selection_end }}"><div class="dh"><b>Minha seleção</b><button id="dclose" aria-label="Fechar">×</button></div><div id="dlist"></div>
<div class="df"><div class="dtot" id="dtotal"></div><button id="dsend" class="btn solid">Enviar minha seleção pelo WhatsApp</button><button id="dcopy" class="btn line">Copiar minha seleção</button><button id="dclear" class="lnk">Limpar seleção</button></div></aside>
<script src="{{ asset('js/main.js') }}"></script></body></html>
